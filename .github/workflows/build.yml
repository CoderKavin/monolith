name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Fetch fonts
        run: bash tools/fetch-fonts.sh

      - name: Build signed APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk Monolith.apk
          # The app compares this number with its own version to offer updates.
          echo $(( GITHUB_RUN_NUMBER + 100 )) > version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Monolith-apk
          path: Monolith.apk

      # A fixed "latest" release so the phone download link never changes.
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Monolith.apk version.txt \
            --title "Monolith (latest build)" \
            --notes "Open this page on your phone and tap Monolith.apk to install." \
            --target "${GITHUB_SHA}"
